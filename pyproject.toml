[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-corpus-refinery"
version = "0.1.0"
description = "Find, license-check, crawl and refine speech audio into versioned TTS training data, with cost per usable hour."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "imageio-ffmpeg>=0.5",
  "sherpa-onnx==1.13.8",
  "pyarrow>=16",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "psycopg[binary,pool]>=3.2",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "python-hcl2>=4.3"]

[project.scripts]
scr = "scr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scr = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs PostgreSQL (SCR_TEST_DATABASE_URL)",
  "models: needs the pinned models (`scr fetch`)",
  "slow: builds the corpus world and runs the whole pipeline",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"scripts/**" = ["S310", "S311"]

[tool.mypy]
files = ["src/scr"]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
